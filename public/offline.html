<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#114e62" />
    <title>House Wolf Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080b0d;
        --panel: #11181b;
        --text: #eef4f3;
        --muted: #9aacaa;
        --accent: #35b8c6;
        --line: #243235;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 0%, rgba(53, 184, 198, 0.16), transparent 34rem),
          var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      main {
        width: min(32rem, calc(100vw - 2rem));
        padding: 2rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: color-mix(in srgb, var(--panel) 90%, transparent);
      }

      img {
        width: 4rem;
        height: 4rem;
        margin-bottom: 1.25rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 4vw, 2.4rem);
        line-height: 1.05;
      }

      p {
        margin: 1rem 0 0;
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        margin-top: 1.5rem;
        color: var(--accent);
        text-decoration: none;
        font-weight: 700;
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/global/pwa-icon-192.png" alt="" />
      <h1>House Wolf is offline</h1>
      <p>
        Your connection dropped before this page could load. Reconnect and return to the
        command center.
      </p>
      <a href="/">Retry connection</a>
    </main>
  </body>
</html>
